<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 30" width="560" height="300" shape-rendering="crispEdges" role="img" aria-label="Pixel art of a developer coding at a desk" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .tw { animation: tw 3s steps(1) infinite; }
    .tw2 { animation-delay: 1s; }
    .tw3 { animation-delay: 2s; }
    @keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .hand { animation: tap 0.5s steps(1) infinite; }
    @keyframes tap { 0% { transform: translateY(0); } 50% { transform: translateY(1px); } }

    .head { animation: nod 4s steps(1) infinite; }
    @keyframes nod { 0% { transform: translateY(0); } 55% { transform: translateY(1px); } 65% { transform: translateY(0); } 85% { transform: translateY(1px); } 92% { transform: translateY(0); } }

    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s steps(1) infinite; }
    @keyframes blink { 0%, 94% { transform: scaleY(1); } 95%, 97% { transform: scaleY(0.2); } 98%, 100% { transform: scaleY(1); } }

    .ln { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: type 9s steps(10) infinite; }
    .l2 { animation-delay: 0.9s; }
    .l3 { animation-delay: 1.8s; }
    .l4 { animation-delay: 2.7s; }
    .l5 { animation-delay: 3.6s; }
    @keyframes type { 0% { transform: scaleX(0); } 12% { transform: scaleX(1); } 88% { transform: scaleX(1); } 94% { transform: scaleX(0); } 100% { transform: scaleX(0); } }

    .cur { animation: cur 1s steps(1) infinite; }
    @keyframes cur { 0% { opacity: 1; } 50% { opacity: 0; } }

    .st { animation: rise 2.4s steps(4) infinite; opacity: 0; }
    .st2 { animation-delay: 1.2s; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 0.8; } 100% { transform: translateY(-4px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .ln { transform: scaleX(1); }
    }
  </style>

  <!-- Room -->
  <rect width="56" height="30" fill="#0d1117"/>
  <rect y="28" width="56" height="2" fill="#21262d"/>

  <!-- Stars -->
  <rect class="tw" x="2" y="3" width="1" height="1" fill="#f0f6fc"/>
  <rect class="tw tw2" x="14" y="2" width="1" height="1" fill="#f0f6fc"/>
  <rect class="tw tw3" x="18" y="1" width="1" height="1" fill="#FCD116"/>
  <rect class="tw tw2" x="31" y="2" width="1" height="1" fill="#f0f6fc"/>
  <rect class="tw" x="54" y="3" width="1" height="1" fill="#f0f6fc"/>
  <rect class="tw tw3" x="3" y="9" width="1" height="1" fill="#f0f6fc"/>

  <!-- Wall flag -->
  <rect x="22" y="3" width="8" height="2" fill="#CE1126"/>
  <rect x="22" y="5" width="8" height="2" fill="#FCD116"/>
  <rect x="22" y="7" width="8" height="2" fill="#006B3F"/>
  <rect x="25" y="5" width="2" height="2" fill="#010409"/>

  <!-- Desk -->
  <rect x="18" y="21" width="38" height="2" fill="#8b5a2b"/>
  <rect x="20" y="23" width="34" height="1" fill="#6b4423"/>
  <rect x="20" y="24" width="2" height="4" fill="#6b4423"/>
  <rect x="52" y="24" width="2" height="4" fill="#6b4423"/>

  <!-- Monitor -->
  <rect x="32" y="5" width="20" height="13" fill="#484f58"/>
  <rect x="33" y="6" width="18" height="11" fill="#010409"/>
  <rect x="41" y="18" width="2" height="2" fill="#6e7681"/>
  <rect x="37" y="20" width="10" height="1" fill="#6e7681"/>

  <!-- Code lines -->
  <g class="ln l1"><rect x="35" y="7" width="3" height="1" fill="#FCD116"/><rect x="39" y="7" width="7" height="1" fill="#2ea043"/></g>
  <g class="ln l2"><rect x="37" y="9" width="4" height="1" fill="#CE1126"/><rect x="42" y="9" width="6" height="1" fill="#c9d1d9"/></g>
  <g class="ln l3"><rect x="37" y="11" width="3" height="1" fill="#CE1126"/><rect x="41" y="11" width="3" height="1" fill="#FCD116"/><rect x="45" y="11" width="3" height="1" fill="#2ea043"/></g>
  <g class="ln l4"><rect x="37" y="13" width="8" height="1" fill="#c9d1d9"/></g>
  <g class="ln l5"><rect x="35" y="15" width="2" height="1" fill="#FCD116"/><rect x="38" y="15" width="9" height="1" fill="#c9d1d9"/></g>
  <rect class="cur" x="48" y="15" width="1" height="1" fill="#FCD116"/>

  <!-- Coffee mug + steam -->
  <rect x="30" y="18" width="3" height="3" fill="#f0f6fc"/>
  <rect x="30" y="18" width="3" height="1" fill="#6f4e37"/>
  <rect x="33" y="19" width="1" height="1" fill="#f0f6fc"/>
  <rect class="st" x="30" y="16" width="1" height="1" fill="#c9d1d9"/>
  <rect class="st st2" x="31" y="16" width="1" height="1" fill="#c9d1d9"/>

  <!-- Chair -->
  <rect x="5" y="12" width="2" height="9" fill="#30363d"/>
  <rect x="6" y="21" width="10" height="1" fill="#484f58"/>
  <rect x="10" y="22" width="1" height="5" fill="#30363d"/>
  <rect x="7" y="27" width="8" height="1" fill="#30363d"/>
  <rect x="7" y="28" width="1" height="1" fill="#6e7681"/>
  <rect x="14" y="28" width="1" height="1" fill="#6e7681"/>

  <!-- Legs -->
  <rect x="8" y="19" width="9" height="2" fill="#2f4f8f"/>
  <rect x="15" y="21" width="2" height="6" fill="#2f4f8f"/>
  <rect x="15" y="27" width="5" height="1" fill="#f0f6fc"/>

  <!-- Torso (Ghana flag hoodie) -->
  <rect x="8" y="12" width="5" height="2" fill="#CE1126"/>
  <rect x="8" y="14" width="5" height="2" fill="#FCD116"/>
  <rect x="8" y="16" width="5" height="3" fill="#006B3F"/>
  <rect x="10" y="14" width="1" height="1" fill="#010409"/>

  <!-- Keyboard -->
  <rect x="18" y="20" width="10" height="1" fill="#6e7681"/>

  <!-- Arm + typing hand -->
  <rect x="10" y="14" width="2" height="4" fill="#a30d20"/>
  <rect x="11" y="16" width="10" height="2" fill="#a30d20"/>
  <g class="hand"><rect x="20" y="17" width="3" height="3" fill="#8d5524"/></g>

  <!-- Head -->
  <g class="head">
    <rect x="10" y="11" width="2" height="1" fill="#8d5524"/>
    <rect x="9" y="6" width="5" height="5" fill="#8d5524"/>
    <rect x="14" y="8" width="1" height="1" fill="#6f3f1a"/>
    <rect x="9" y="5" width="5" height="2" fill="#010409"/>
    <rect x="9" y="7" width="1" height="3" fill="#010409"/>
    <rect x="9" y="4" width="5" height="1" fill="#FCD116"/>
    <rect x="10" y="7" width="2" height="3" fill="#006B3F"/>
    <rect class="blink" x="12" y="8" width="1" height="1" fill="#010409"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
