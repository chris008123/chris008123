<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">Cyberpunk developer at work</title>
  <desc id="desc">A futuristic developer in a dark hood and crimson tactical jacket works at a glowing code monitor in a neon-lit workspace.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080d16"/><stop offset=".58" stop-color="#111827"/><stop offset="1" stop-color="#090d14"/></linearGradient>
    <linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff425b"/><stop offset=".5" stop-color="#c51e3a"/><stop offset="1" stop-color="#641326"/></linearGradient>
    <linearGradient id="hood" x2="1" y2="1"><stop stop-color="#293447"/><stop offset="1" stop-color="#0c121d"/></linearGradient>
    <linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#f1f4f2"/><stop offset=".5" stop-color="#aab7c5"/><stop offset="1" stop-color="#586779"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#111e31"/><stop offset="1" stop-color="#07101d"/></linearGradient>
    <linearGradient id="cyan" x2="1"><stop stop-color="#35d7ee"/><stop offset="1" stop-color="#668cff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ef2949" stop-opacity=".28"/><stop offset="1" stop-color="#ef2949" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="neon" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="screenClip"><rect x="326" y="48" width="202" height="139" rx="7"/></clipPath>
  </defs>
  <style>
    .ambient{animation:ambient 5s ease-in-out infinite alternate;transform-origin:50% 50%}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    .blink{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
    .typing{animation:typing .34s ease-in-out infinite alternate;transform-origin:top center}
    .cursor{animation:cursor 1s steps(2,end) infinite}
    .steam{animation:steam 2.6s ease-in-out infinite}
    .steam.s2{animation-delay:1.1s}
    .scan{animation:scan 5s linear infinite}
    @keyframes ambient{from{opacity:.55}to{opacity:1}}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes blink{0%,93%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(.12)}}
    @keyframes typing{from{transform:translateY(0)}to{transform:translateY(2px)}}
    @keyframes cursor{0%,48%{opacity:1}50%,100%{opacity:0}}
    @keyframes steam{0%{transform:translateY(5px);opacity:0}30%{opacity:.55}100%{transform:translateY(-13px);opacity:0}}
    @keyframes scan{0%{transform:translateY(-135px);opacity:0}10%{opacity:.22}90%{opacity:.15}100%{transform:translateY(140px);opacity:0}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
  </style>

  <!-- Neon-lit room -->
  <rect width="560" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="130" cy="118" r="150" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="450" cy="100" r="130" fill="#087eaa" opacity=".12" filter="url(#soft)"/>
  <path d="M0 236H560" stroke="#273448" stroke-width="2"/>
  <g opacity=".7">
    <path d="M26 0V78H52V0M66 0V42H78V0" stroke="#12bad1" stroke-width="5" opacity=".3"/>
    <path d="M545 0V95H524V0" stroke="#ed284b" stroke-width="6" opacity=".35"/>
    <path d="M18 88H92M470 26H540" stroke="#25374d" stroke-width="2"/>
    <rect x="20" y="104" width="8" height="54" rx="3" fill="#ef2949" opacity=".55"/>
    <rect x="535" y="116" width="5" height="43" rx="2" fill="#20c7e5" opacity=".6"/>
  </g>
  <g class="ambient" opacity=".7">
    <circle cx="44" cy="34" r="2" fill="#44d9ef"/><circle cx="88" cy="70" r="1.5" fill="#f23b5a"/>
    <circle cx="506" cy="34" r="2" fill="#f23b5a"/><circle cx="480" cy="218" r="1.5" fill="#42d8ee"/>
  </g>

  <!-- Monitor -->
  <g>
    <rect x="309" y="31" width="237" height="171" rx="12" fill="#27364a" stroke="#52647a" stroke-width="2"/>
    <rect x="317" y="39" width="221" height="155" rx="7" fill="#050a12"/>
    <rect x="326" y="48" width="202" height="139" rx="5" fill="url(#screen)"/>
    <g clip-path="url(#screenClip)">
      <rect x="326" y="48" width="202" height="18" fill="#17263b"/>
      <circle cx="338" cy="57" r="3" fill="#ff5268"/><circle cx="349" cy="57" r="3" fill="#f5c451"/><circle cx="360" cy="57" r="3" fill="#40d69a"/>
      <text x="376" y="60" fill="#8496ad" font-size="7" font-family="monospace">workspace / main.ts</text>
      <path d="M350 72V181" stroke="#23334a"/>
      <g font-family="monospace" font-size="9">
        <text x="336" y="82" fill="#71839b">01</text><text x="357" y="82" fill="#e8a6ff">const</text><text x="385" y="82" fill="#77d8ef"> build</text><text x="415" y="82" fill="#d9e4f3"> = () =&gt; {</text>
        <text x="336" y="99" fill="#71839b">02</text><text x="366" y="99" fill="#8ddca8">return</text><text x="402" y="99" fill="#d9e4f3"> (</text><text x="413" y="99" fill="#f4c66b">&lt;Profile /&gt;</text>
        <text x="336" y="116" fill="#71839b">03</text><text x="366" y="116" fill="#d9e4f3">  theme=</text><text x="404" y="116" fill="#f19aab">"midnight"</text>
        <text x="336" y="133" fill="#71839b">04</text><text x="366" y="133" fill="#d9e4f3">  accent=</text><text x="407" y="133" fill="#f19aab">"crimson"</text>
        <text x="336" y="150" fill="#71839b">05</text><text x="366" y="150" fill="#d9e4f3">  motion=</text><text x="406" y="150" fill="#f19aab">"smooth"</text>
        <text x="336" y="167" fill="#71839b">06</text><text x="357" y="167" fill="#e8a6ff">export</text><text x="389" y="167" fill="#8ddca8"> default</text><text x="431" y="167" fill="#d9e4f3"> build</text>
      </g>
      <rect class="cursor" x="476" y="160" width="2" height="10" rx="1" fill="#39d8ef"/>
      <rect class="scan" x="326" y="48" width="202" height="18" fill="#39d8ef" opacity=".12"/>
    </g>
    <path d="M414 202V220H440V202" fill="#53657a"/>
    <path d="M393 221H462L472 228H383Z" fill="#718197"/>
    <path d="M320 202H535" stroke="#e72c4c" stroke-width="2" opacity=".65" filter="url(#neon)"/>
  </g>

  <!-- Desk -->
  <path d="M22 235H548L560 249H0Z" fill="#293447"/>
  <path d="M0 249H560V300H0Z" fill="#111a28"/>
  <path d="M0 249H560" stroke="#506078" stroke-width="2"/>
  <path d="M0 258H560" stroke="#1d2b3e"/>

  <!-- Character: hood and shoulders -->
  <g>
    <path d="M67 244Q70 201 101 174Q119 157 158 157Q200 156 225 184Q244 205 249 244Z" fill="url(#hood)" stroke="#43536a" stroke-width="2"/>
    <path d="M87 240Q91 201 117 184L144 205L130 250Z" fill="#111a28"/>
    <path d="M177 183Q218 180 235 213L250 244H185L164 210Z" fill="url(#red)" stroke="#ff5368" stroke-width="1.5"/>
    <path d="M191 198L224 211L238 239H205L184 218Z" fill="#8e1830"/>
    <path d="M82 226L106 202L126 217L111 245H75Z" fill="#1a2637" stroke="#66778c" stroke-width="2"/>
    <path d="M187 224L218 224L229 239H185Z" fill="#202d40" stroke="#b72b45" stroke-width="2"/>
    <rect x="205" y="227" width="15" height="8" rx="2" fill="#0a111c" stroke="#e9445d"/>
    <path d="M210 231H216" stroke="#41d8ec" stroke-width="1.5" class="pulse"/>
    <!-- chest harness -->
    <path d="M132 180L153 199L143 244H117L126 202Z" fill="#34445a" stroke="#62748b"/>
    <path d="M151 199L172 181L189 203L176 244H145Z" fill="#101927" stroke="#45566c"/>
    <path d="M154 207L171 207L166 224H149Z" fill="#a61e39" stroke="#fa4963"/>
    <path d="M156 211H166M154 216H164" stroke="#ffb1bc" stroke-width="1" opacity=".8"/>
    <!-- hood silhouette -->
    <path d="M94 177Q91 135 124 117Q159 99 190 126Q212 145 203 184L184 207L168 186L136 177L111 201Z" fill="url(#hood)" stroke="#53657a" stroke-width="3"/>
    <path d="M104 156Q105 123 139 116Q176 108 195 143L185 164L162 151L131 163Z" fill="#202c3e"/>
    <path d="M109 149Q119 119 151 116" fill="none" stroke="#e72d4c" stroke-width="3" opacity=".75"/>
    <!-- helmet / mask -->
    <path d="M117 131Q127 109 153 109Q181 110 190 137L184 170Q177 189 151 191Q127 187 117 165Z" fill="url(#metal)" stroke="#e4eaf0" stroke-width="2"/>
    <path d="M120 137Q141 124 185 137L181 154Q159 164 123 153Z" fill="#111b2a" stroke="#65768a" stroke-width="2"/>
    <path d="M129 144L148 143L145 150L129 151Z" fill="#4bd9ec" filter="url(#neon)" class="blink"/>
    <path d="M157 143L176 145L173 152L157 150Z" fill="#f13a59" filter="url(#neon)"/>
    <path d="M149 154L155 154L153 160L148 160Z" fill="#24364b"/>
    <path d="M135 164L169 166L163 177L144 178Z" fill="#263548" stroke="#718196"/>
    <path d="M143 168L147 168M151 169L155 169M159 169L163 169" stroke="#c6d0dc" stroke-width="2"/>
    <path d="M118 140L108 148L111 165L122 170" fill="none" stroke="#b8c4d0" stroke-width="5"/>
    <circle cx="112" cy="155" r="9" fill="#26374c" stroke="#e63855" stroke-width="2"/>
    <circle cx="112" cy="155" r="3" fill="#49d8ed" class="pulse"/>
    <path d="M177 121L190 109L197 119L188 139" fill="#a9b5c2" stroke="#e5eaf0" stroke-width="2"/>
    <path d="M186 119L196 113" stroke="#f13a59" stroke-width="3"/>
    <!-- helmet crest details -->
    <path d="M139 111L133 94L147 108L151 91L158 109L171 96L168 115" fill="#aab7c5" stroke="#e8edf2" stroke-width="2" stroke-linejoin="round"/>
    <path d="M150 111L152 99" stroke="#ed3150" stroke-width="2"/>
  </g>

  <!-- Arms and typing hands -->
  <g class="typing">
    <path d="M192 205Q220 198 245 215L274 233L261 247L226 232L194 232Z" fill="url(#red)" stroke="#ef5369" stroke-width="2"/>
    <path d="M234 222L260 235L252 247L226 237Z" fill="#192538" stroke="#718096"/>
    <path d="M254 239L277 241L280 248L255 249Z" fill="#b7c3cf"/>
    <path d="M275 241L302 241L305 247L279 249Z" fill="#d4dde6"/>
    <path d="M265 237L274 235L282 240L278 245L266 244Z" fill="#d3a17e"/>
  </g>
  <path d="M72 243H311" stroke="#65758a" stroke-width="2"/>
  <path d="M242 251H320" stroke="#1c2a3d" stroke-width="3"/>

  <!-- Keyboard -->
  <path d="M274 231L356 231L373 245L286 245Z" fill="#1c2a3d" stroke="#687a91" stroke-width="1.5"/>
  <path d="M284 235L350 235" stroke="#4c617b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M292 240L358 240" stroke="#31cde6" stroke-width="1" opacity=".75"/>

  <!-- Coffee and small desk details -->
  <g>
    <path d="M39 226H66L63 247H42Z" fill="#26364b" stroke="#8fa0b4" stroke-width="1.5"/>
    <path d="M65 231Q78 229 74 240Q71 246 64 243" fill="none" stroke="#8fa0b4" stroke-width="3"/>
    <path d="M43 231H65" stroke="#ed3150" stroke-width="2"/>
    <path class="steam" d="M48 220Q42 214 49 208" fill="none" stroke="#8bdff0" stroke-width="2" stroke-linecap="round"/>
    <path class="steam s2" d="M58 220Q53 213 60 206" fill="none" stroke="#8bdff0" stroke-width="2" stroke-linecap="round"/>
    <rect x="494" y="232" width="30" height="7" rx="3" fill="#182538" stroke="#43546a"/>
    <circle cx="516" cy="235.5" r="2" fill="#40d9ed" class="pulse"/>
  </g>

  <!-- Foreground neon edge -->
  <path d="M0 268H560" stroke="#e52b4b" stroke-width="1" opacity=".22"/>
  <path d="M18 282H108" stroke="#36cfe8" stroke-width="2" opacity=".45"/>
  <path d="M458 282H542" stroke="#ed3150" stroke-width="2" opacity=".55"/>
  <rect x="1" y="1" width="558" height="298" rx="17" fill="none" stroke="#34445a" stroke-width="2" opacity=".8"/>
</svg>
